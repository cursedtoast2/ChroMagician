[workspace]
members = [
    "crates/chromatic-backup-core",
    "crates/chromatic-backup-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/cursedtoast2/ChroMagician"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
