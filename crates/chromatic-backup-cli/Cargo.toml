[package]
name = "chromatic-backup-cli"
description = "Command-line cartridge backup client for ModRetro Chromatic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chromatic-backup"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chromatic-backup-core = { path = "../chromatic-backup-core" }
clap = { version = "4.5.47", features = ["derive"] }
serde_json = "1.0.143"

[lints]
workspace = true
